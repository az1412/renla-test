name: AI Morning Brief

on:
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:

concurrency:
  group: ai-morning-brief
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send brief
        run: python scripts/generate_and_send_brief.py

      - name: Upload brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-morning-brief
          path: artifacts/ai_morning_brief.txt
